<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CareerOS Cloud</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>CareerOS Cloud</h1><p>Capture a vaga aberta para revisar no seu painel. Esta extensão não preenche nem envia candidaturas.</p>
<label for="origin">Endereço do seu CareerOS</label><input id="origin" type="url" placeholder="https://seu-careeros.onrender.com" autocomplete="off">
<label for="token">Token de acesso da sua conta</label><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Cole o token copiado no painel">
<p class="notice">O token permite acesso à sua conta. Cole apenas aqui, em seu próprio navegador. Fica somente nesta sessão e expira; copie outro no painel quando necessário. Nunca cole chaves de IA.</p>
<button id="connect">Salvar origem e conectar</button><button id="capture">Capturar vaga atual</button><button id="logout">Desconectar</button><p id="status" role="status" aria-live="polite"></p>
<script src="origin.js"></script><script src="popup.js"></script></body></html>
