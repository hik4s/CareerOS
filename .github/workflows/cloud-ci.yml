name: Cloud checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-cloud.txt pytest
      - run: python -m pytest -q tests/test_cloud*.py tests/test_regional_search.py tests/test_source_discovery.py
      - run: python -m compileall -q app/cloud
      - run: node --check extension-cloud/background.js && node --check extension-cloud/popup.js && node --check extension-cloud/origin.js
      - run: node --check app/cloud/static/app.js && node --check app/cloud/static/vendor/supabase.js
      - run: node scripts/test_cloud_loading.cjs
      - run: node scripts/test_profile_import.cjs
