name: Windows Installer
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: pyinstaller --clean --noconfirm packaging/CareerOS.spec
      - run: choco install innosetup -y
      - shell: pwsh
        run: |
          $careerVersion = python -c "from app.version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$careerVersion" packaging\CareerOS.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: CareerOS-Windows-Installer
          path: installer/*.exe
